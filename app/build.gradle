plugins { id 'com.android.application' }
android {
    namespace 'fr.echo.app'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.echo.app'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '0.5.0'
    }
    signingConfigs {
        // 0.5: a private release key. It is never in this repo: GitHub Actions gets it from the repo's
        // secrets (ECHO_KEYSTORE_B64, ECHO_KEYSTORE_PASSWORD) and writes it to $ECHO_KEYSTORE for the build.
        release {
            storeFile file(System.getenv('ECHO_KEYSTORE') ?: 'no-release-key.p12')
            storeType 'pkcs12'
            storePassword System.getenv('ECHO_KEYSTORE_PASSWORD')
            keyAlias 'echo'
            keyPassword System.getenv('ECHO_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
